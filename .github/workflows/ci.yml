name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (syswall-proto / prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --all -- --check
      # ui (crate Tauri) exclu: depend de Tauri qui a ses propres conventions de lint, hors scope sous-projet B.
      - name: cargo clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --exclude ui --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (syswall-proto / prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # ui exclu : crate Tauri exigeant les libs systeme GTK/WebKit absentes des
      # runners (coherent avec le job lint qui l'exclut deja de clippy).
      # ui excluded: Tauri crate needing GTK/WebKit system libs absent from runners
      # (consistent with the lint job already excluding it from clippy).
      - run: cargo test --workspace --exclude ui

  ui:
    name: UI (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: crates/ui/package-lock.json
      - run: cd crates/ui && npm ci
      - run: cd crates/ui && npm run check
      - run: cd crates/ui && npm run build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # quick-xml (RUSTSEC-2026-0194/0195) : tire par plist (parsing .plist Apple),
      # fige a ^0.38 par tauri et absent du build Linux -> non atteignable ici.
      # A retirer des qu'un bump de tauri permet quick-xml >= 0.41.
      # quick-xml: pulled by plist (Apple .plist parsing), pinned to ^0.38 by tauri and
      # absent from the Linux build -> not reachable here. Drop once a tauri bump allows
      # quick-xml >= 0.41.
      - run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - run: cd crates/ui && npm audit --audit-level=high

  deny:
    name: Cargo deny (licenses + bans + sources + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config deny.toml

  hardening-check:
    name: systemd hardening check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify syswall.service hardening directives
        run: ./system/tests/check-hardening.sh
      - name: Verify service/installers consistency (SYSWALL_CONFIG + syswall user)
        run: ./system/tests/check-service-config.sh

  grpc-integration:
    name: gRPC integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (syswall-proto / prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run gRPC integration tests
        env:
          SYSWALL_TEST_GRPC: '1'
        run: cargo test -p syswall-daemon --test grpc_limits_test -- --nocapture

  nfqueue-smoke:
    name: NFQUEUE smoke test (privileged container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (syswall-proto / prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install kernel modules (nfnetlink_queue)
        run: |
          sudo modprobe nfnetlink_queue || echo "module load may fail in CI runner"
          lsmod | grep -E '^nfnetlink_queue' || echo "module not loaded — smoke test will detect at runtime"
      - name: Run NFQUEUE smoke test
        run: sudo -E env "PATH=$PATH" SYSWALL_TEST_NFQUEUE=1 cargo test -p syswall-daemon --test nfqueue_smoke_test -- --nocapture
        continue-on-error: true  # CI runner may not have CAP_NET_ADMIN; report but don't block

  fuzz-smoke:
    name: Fuzz smoke (60s par cible / per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (syswall-proto / prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # libFuzzer écrit dans le 1er répertoire : corpus jetable d'abord, seeds versionnés en lecture seule ensuite.
      # libFuzzer writes to the 1st directory: throwaway corpus first, versioned read-only seeds second.
      - name: Fuzz domain (criteria/scope/rule JSON)
        working-directory: crates/domain
        run: |
          mkdir -p fuzz/corpus/fuzz_rule_criteria_json
          cargo +nightly fuzz run fuzz_rule_criteria_json fuzz/corpus/fuzz_rule_criteria_json fuzz/seeds/fuzz_rule_criteria_json -- -max_total_time=60
      - name: Fuzz daemon (config TOML)
        working-directory: crates/daemon
        run: |
          mkdir -p fuzz/corpus/fuzz_config_toml
          cargo +nightly fuzz run fuzz_config_toml fuzz/corpus/fuzz_config_toml fuzz/seeds/fuzz_config_toml -- -max_total_time=60
      - name: Fuzz daemon (CreateRuleRequest)
        working-directory: crates/daemon
        run: cargo +nightly fuzz run fuzz_create_rule_cmd -- -max_total_time=60
