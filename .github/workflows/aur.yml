name: AUR Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Update AUR package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release tarball and compute sha256
        id: sha
        run: |
          url="https://github.com/yrbane/SysWall/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Update AUR PKGBUILD
        run: |
          cd system/aur
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.sha.outputs.sha256 }}')/" PKGBUILD

      - name: Push to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3
        with:
          pkgname: syswall
          pkgbuild: system/aur/PKGBUILD
          commit_username: yrbane
          commit_email: yrbane@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
          assets: |
            system/aur/PKGBUILD
            system/aur/.SRCINFO
            system/aur/syswall.install
